<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Sobre hora-control</title>
<desc id="desc">Sistema web de controle de ponto educacional: professores e coordenadores registram entrada e saída vinculadas às suas turmas, e o gestor educacional administra cadastros, ajustes e relatórios.</desc>
<style>
