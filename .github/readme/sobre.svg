<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Sobre o projeto</text>
<text x="70" y="122" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">Sistema web de<tspan font-weight="700" fill="#ece9e4"> controle</tspan><tspan font-weight="700" fill="#ece9e4"> de</tspan><tspan font-weight="700" fill="#ece9e4"> ponto</tspan><tspan font-weight="700" fill="#ece9e4"> educacional</tspan>: professores e coordenadores registram entrada e saída vinculadas</text>
<text x="70" y="149" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">às suas turmas, e o gestor educacional administra cadastros, ajustes e relatórios.</text>
<rect x="48" y="180" width="1104" height="1" fill="#3a3733"/>
<rect x="72" y="201" width="7" height="7" fill="#d97757"/>
<text x="92" y="210" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Três perfis de acesso com<tspan font-weight="700" fill="#ece9e4"> Spring</tspan><tspan font-weight="700" fill="#ece9e4"> Security</tspan></text>
