<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de hora-control</title>
<desc id="desc">Três perfis de acesso: Professor, Coordenador e Gestor educacional, com autorização por tipo de usuário via Spring Security. · Registro de ponto: Horário do servidor, sempre vinculado a uma turma ativa e com no máximo um ponto aberto por pessoa. · Consulta por perfil: O coordenador vê apenas os professores do curso pelo qual é responsável. · Ajustes auditados: Só o gestor ajusta ponto, sempre com justificativa e trilha de auditoria. · Relatórios em PDF: Gerados com OpenPDF; o escopo do usuário é garantido no back-end, mesmo se a URL for manipulada. · Histórico preservado: Exclusão lógica de usuários e turmas, e migrações versionadas com Flyway.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="490" rx="10"/></clipPath>
</defs>
