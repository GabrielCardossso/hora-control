<text x="68" y="174" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Professor</tspan>,<tspan font-weight="700" fill="#ece9e4"> Coordenador</tspan> e<tspan font-weight="700" fill="#ece9e4"> Gestor</tspan><tspan font-weight="700" fill="#ece9e4"> educacional</tspan>, com</text>
<text x="68" y="196" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">autorização por tipo de usuário via Spring Security.</text>
